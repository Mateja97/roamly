syntax = "proto3";

package activities.v1;

option go_package = "backend/shared/proto/activities/v1;activitiesv1";

// ActivitiesService owns the activity catalog and answers scoped, filtered
// queries against it. Stateless about users: callers supply whatever
// location context a scope needs on every request.
service ActivitiesService {
  rpc QueryActivities(QueryActivitiesRequest) returns (QueryActivitiesResponse);
  // SuggestCities powers the Anywhere city typeahead: a prefix match over
  // the catalog's own cities (T1's city column), not a live geocoding call.
  rpc SuggestCities(SuggestCitiesRequest) returns (SuggestCitiesResponse);

  // Admin surface (T2): full read/write access over the catalog, including
  // draft/pending rows. No RPC-level auth here — this traffic never leaves
  // the compose/cluster network; proxy-service's admin-token middleware is
  // the gate, same as every other proxy->activities-service call.
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  rpc GetActivity(GetActivityRequest) returns (Activity);
  // GetActivityPhotos (T2) returns one activity's full photo set, resolving
  // the rest of a venue's Google photos live (via internal/places, using the
  // activity's own stored external_id, never exposed on this wire) the first
  // time anyone asks and persisting them so every later call is cache-only.
  // Never fails on a Places timeout/error — falls back to whatever is
  // already stored, at minimum the provisional listing photo. Public
  // surface (not admin-only): this is what the app's detail screen calls.
  rpc GetActivityPhotos(GetActivityPhotosRequest) returns (GetActivityPhotosResponse);
  // GetActivityWithLiveDetails (T3, places-live-details) is the public
  // detail-page surface: same request/response shapes as GetActivity, but
  // backed by service.Activities.GetByIDWithLiveDetails, which merges fresh
  // Google Place Details onto a Places-sourced row's Details/Description
  // and populates GoogleReviews/ReviewCount below — never persisted (Places
  // Terms §14.3). GetActivity itself (the admin RPC) is deliberately
  // unchanged and keeps calling plain GetByID: an admin's edit-save
  // round-trip must never write live Google content back into storage.
  rpc GetActivityWithLiveDetails(GetActivityRequest) returns (Activity);
  rpc CreateActivity(CreateActivityRequest) returns (Activity);
  rpc UpdateActivity(UpdateActivityRequest) returns (Activity);
  // ListAdminCities returns every distinct city with at least one activity,
  // any status (unlike SuggestCities, which is published-only and requires
  // a non-empty prefix) — backs the admin panel's city filter dropdown.
  rpc ListAdminCities(ListAdminCitiesRequest) returns (ListAdminCitiesResponse);

  // UploadPhoto (T1) is unary, not client-streaming: one admin, one <=8MB
  // file, so the extra complexity of a streaming RPC buys nothing. The
  // decode (image/jpeg or image/png) IS the content-type check — a decode
  // failure is InvalidArgument, never a trust of the client's declared MIME
  // type or file extension. activities-service is the sole writer of
  // /data/photos, so the downscale + encode + write all happen here, not at
  // proxy-service's HTTP edge.
  rpc UploadPhoto(UploadPhotoRequest) returns (UploadPhotoResponse);
}

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  reserved 1, 3; // formerly SCOPE_HOME, SCOPE_OUTSIDE_COUNTRY; retired.
  reserved "SCOPE_HOME", "SCOPE_OUTSIDE_COUNTRY";
  // Activities within the service's configured radius of current_location.
  SCOPE_NEARBY = 2;
  // Broad exploration anchored to current_location when supplied. With
  // max_distance_km set, narrows to that radius; otherwise unfiltered by
  // distance ("truly anywhere").
  SCOPE_ANYWHERE = 4;
}

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_RESTAURANTS = 1;
  CATEGORY_CAFES = 2;
  CATEGORY_BARS = 3;
  CATEGORY_NIGHTLIFE = 4;
  CATEGORY_NATURE = 5;
  CATEGORY_SPORT = 6;
  CATEGORY_KIDS = 7;
  CATEGORY_CULTURE = 8;
  CATEGORY_ART = 9;
  CATEGORY_WELLNESS = 10;
  CATEGORY_SHOPPING = 11;
  CATEGORY_ENTERTAINMENT = 12;
  CATEGORY_TOURS_EXPERIENCES = 13;
}

// ActivityStatus (T1) is an activity's catalog lifecycle state. Only
// ACTIVITY_STATUS_PUBLISHED activities are ever returned by
// QueryActivities, the public app-facing RPC — draft/pending exist for the
// admin surface (T2) to read and write.
enum ActivityStatus {
  ACTIVITY_STATUS_UNSPECIFIED = 0;
  ACTIVITY_STATUS_PUBLISHED = 1;
  ACTIVITY_STATUS_DRAFT = 2;
  ACTIVITY_STATUS_PENDING = 3;
}

message Location {
  double lat = 1;
  double lng = 2;
}

// Photo is a single activity photo, sourced from Google Places and resolved
// once — either at seed/build time, or live on first detail view via
// GetActivityPhotos (T2), which persists the result so every later request
// is cache-only. Author
// attribution travels with the photo wherever it's shown, per Google's
// mandatory attribution policy; author/author_link are empty for a photo
// that hasn't been resolved yet (falls back to the missing-image state
// client-side rather than a placeholder).
message Photo {
  string url = 1;
  string author = 2;
  string author_link = 3;
  // thumb_url and caption are T1 additions: an uploaded photo (as opposed to
  // a Google-sourced one) gets a real 256px thumbnail at an explicit URL
  // (never derived by a naming convention) and an optional caption,
  // independent of attribution. Both are empty for a Google-sourced photo.
  string thumb_url = 4;
  string caption = 5;
  // provider is the raw activitiessvc.Provider string ("google",
  // "tripadvisor", "admin", "user"). Only a "google" photo gets the
  // Google-Photos-style attribution caption client-side — Tripadvisor's
  // author field holds the reviewer's username, not a Google Photos
  // contributor, and must not be rendered the same way.
  string provider = 6;
}

message QueryActivitiesRequest {
  reserved 3, 4, 6, 9; // formerly home_location, home_country, a dropped
  // filter field, and sort — all dead product surface after the two-scope
  // (nearby/anywhere) collapse.
  reserved "home_location", "home_country", "sort";

  Scope scope = 1;

  // Required when scope == SCOPE_NEARBY. Optional for SCOPE_ANYWHERE: when
  // absent, anywhere returns broadly with no distance filter.
  Location current_location = 2;

  // Filters, all optional, combined as AND. An unfiltered request returns
  // all in-scope activities.
  repeated Category categories = 5; // OR within this field.
  double min_rating = 7;            // 0 = no filter.
  // Narrows results to within this radius of current_location, or (for
  // SCOPE_ANYWHERE) of the nearest entry in cities. 0 = no filter
  // (SCOPE_NEARBY still applies its configured default radius; SCOPE_ANYWHERE
  // returns unfiltered by distance, i.e. "truly anywhere"). Requires
  // current_location or a non-empty cities to be set; SCOPE_ANYWHERE accepts
  // any positive value (not capped to SCOPE_NEARBY's configured radius).
  double max_distance_km = 8;

  // SCOPE_ANYWHERE only: zero or more city centroids (resolved client-side,
  // e.g. from a typeahead) to anchor the search on instead of
  // current_location. When set, results are the union of activities within
  // max_distance_km of ANY listed city, and current_location is ignored for
  // filtering purposes.
  repeated Location cities = 10;

  // Narrows results to activities whose subcategory is any of these
  // (T1), OR'd within the field and AND-ed with categories above. Slugs
  // from activitiessvc.Subcategories; empty = no filter.
  repeated string subcategories = 11;
}

message Activity {
  reserved 7; // formerly a filter field, dropped as dead product surface.

  string id = 1;
  string title = 2;
  string description = 3;
  Category category = 4;
  Location location = 5;
  string country = 6;
  double rating = 8;
  repeated Photo photos = 9;
  repeated string tags = 10;
  // Distance from the request's reference location, in kilometers. Only
  // populated when the request scope had a reference point (SCOPE_NEARBY
  // always; SCOPE_ANYWHERE when current_location was supplied); 0 otherwise.
  double distance_km = 11;
  // Category-specific structured detail payload (T2), JSON-encoded (a
  // decoded JSON object per APP_STANDARDS.md's per-category field table,
  // e.g. {"cuisine": "Italian", "popular_dishes": [...]});
  // "{}" when the category has no detail data. A JSON string rather than
  // 13 proto messages: the app renders it generically off a data-driven
  // config, not 13 typed screens.
  string details = 12;

  // city, address, and status are T1 additions: city was already a DB
  // column (unexposed on the wire before now); address is new. Both are
  // empty when unset. status is always ACTIVITY_STATUS_PUBLISHED on
  // QueryActivities responses (see ActivityStatus above); exposed here as
  // a real field for the admin surface (T2), which reads/writes all three.
  string city = 13;
  string address = 14;
  ActivityStatus status = 15;

  // subcategory (T1) is an optional, category-validated subtype slug
  // (activitiessvc.Subcategories), e.g. "fine_dining" under "restaurants".
  // "" = not set; always valid.
  string subcategory = 16;

  // google_reviews, review_count, and google_maps_uri (T3,
  // places-live-details) are only ever populated on a
  // GetActivityWithLiveDetails response for a Places-sourced row — always
  // empty/0 on QueryActivities/GetActivity, since neither is ever stored.
  // review_count is Google's live userRatingCount, merged alongside rating
  // above. google_maps_uri is the mandatory "View on Google Maps"
  // attribution link target (Places API attribution policy).
  repeated GoogleReview google_reviews = 17;
  int32 review_count = 18;
  string google_maps_uri = 19;
}

// GoogleAuthorAttribution is the Places API's mandatory per-review
// attribution (T3, places-live-details) — avatar, display name, profile
// link. photo_uri is "" when Google returned no reviewer avatar.
message GoogleAuthorAttribution {
  string display_name = 1;
  string photo_uri = 2;
  string uri = 3;
}

// GoogleReview is one live Google Place Details review (T3,
// places-live-details), merged onto Activity.google_reviews on detail-page
// open for a Places-sourced row; never persisted. publish_time is Places'
// raw timestamp string, not pre-formatted — the client formats it for
// display.
message GoogleReview {
  GoogleAuthorAttribution author_attribution = 1;
  double rating = 2;
  string text = 3;
  string publish_time = 4;
}

message QueryActivitiesResponse {
  repeated Activity activities = 1;
}

message SuggestCitiesRequest {
  // Free-text prefix, e.g. "Bar". Empty or non-matching yields an empty
  // suggestions list, never an error.
  string query = 1;
}

message CitySuggestion {
  string city = 1;
  string country = 2;
  // Centroid of the city's activities, usable directly as a "cities" entry
  // in a follow-up QueryActivitiesRequest.
  Location centroid = 3;
}

message SuggestCitiesResponse {
  repeated CitySuggestion suggestions = 1;
}

// ListActivitiesRequest is the admin list query (T2). All filters are
// optional and combined as AND; UNSPECIFIED enum values / empty strings mean
// "no filter on this field" — unlike QueryActivitiesRequest, this list is
// never restricted to published-only (the admin needs to see drafts and
// pending rows).
message ListActivitiesRequest {
  string q = 1;              // case-insensitive substring match on title
  Category category = 2;     // CATEGORY_UNSPECIFIED = no filter
  string city = 3;            // "" = no filter
  ActivityStatus status = 4; // ACTIVITY_STATUS_UNSPECIFIED = no filter
  int32 page = 5;             // <= 0 treated as 1
  int32 page_size = 6;        // <= 0 treated as the service default; always clamped to [1, 100] server-side
}

// ListActivitiesStats counts the whole catalog, ignoring ListActivitiesRequest's
// filters — it backs the admin panel's global stat cards.
message ListActivitiesStats {
  int32 total = 1;
  int32 published = 2;
  int32 draft = 3;
  int32 pending = 4;
}

message ListActivitiesResponse {
  repeated Activity activities = 1;
  int32 total = 2; // count matching the request's filters (for pagination)
  int32 page = 3;
  int32 page_size = 4;
  ListActivitiesStats stats = 5;
}

message GetActivityRequest {
  string id = 1;
}

message GetActivityPhotosRequest {
  string id = 1;
}

message GetActivityPhotosResponse {
  repeated Photo photos = 1;
}

message ListAdminCitiesRequest {}

message ListAdminCitiesResponse {
  repeated string cities = 1; // sorted, distinct, never null (empty list, not an error, when the catalog has none)
}

// UploadPhotoRequest carries the raw, still-encoded (JPEG/PNG) bytes of one
// admin-uploaded photo (T1) — data is capped by proxy-service's
// http.MaxBytesReader (8MB) before it ever reaches this RPC; server/client
// MaxRecvMsgSize/MaxSendMsgSize are raised to 12MB (payload + headroom) to
// carry it.
message UploadPhotoRequest {
  string activity_id = 1;
  bytes data = 2;
}

// UploadPhotoResponse is the pair of URLs proxy-service's public
// http.FileServer over /data/photos serves — the main downscaled photo
// (2000px longest edge) and its thumbnail (256px longest edge).
message UploadPhotoResponse {
  string url = 1;
  string thumb_url = 2;
}

message CreateActivityRequest {
  string title = 1;
  Category category = 2;
  string description = 3;
  string city = 4;
  string address = 5;
  // ACTIVITY_STATUS_UNSPECIFIED defaults to ACTIVITY_STATUS_DRAFT.
  ActivityStatus status = 6;
  string details = 7; // JSON string, "" = no detail data
  repeated Photo photos = 8;
  // subcategory (T1) is optional, validated against category server-side; a
  // mismatch is rejected InvalidArgument. "" is always valid.
  string subcategory = 9;
}

// PhotoList wraps the one repeated field UpdateActivityRequest needs
// optional (proto3 doesn't allow the `optional` keyword on repeated fields);
// a nil PhotoList means "leave photos untouched", a non-nil one (even with
// zero photos) means "replace with this list".
message PhotoList {
  repeated Photo photos = 1;
}

// UpdateActivityRequest is a partial update (T2): every field below is
// `optional`, so the generated Has*() accessor distinguishes "absent, leave
// untouched" from "present" (including present-and-empty-string) the same
// way proxy-service's JSON pointer fields do on the HTTP side.
message UpdateActivityRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional Category category = 4;
  optional string city = 5;
  optional string address = 6;
  optional ActivityStatus status = 7;
  optional string details = 8;
  PhotoList photos = 9;
  // subcategory (T1): same optional/category-validated semantics as
  // CreateActivityRequest's field. `optional` distinguishes "absent, leave
  // untouched" from "present" (including present-and-empty, i.e. clear it).
  optional string subcategory = 10;
}
