services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  activities-db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: activities
      POSTGRES_PASSWORD: activities
      POSTGRES_DB: activities
    ports:
      - "5432:5432"
    volumes:
      - activities-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activities"]
      interval: 5s
      timeout: 5s
      retries: 10

  activities-service:
    build:
      context: ./backend
      dockerfile: activities-service/Dockerfile
    environment:
      DATABASE_URL: "postgres://activities:activities@activities-db:5432/activities?sslmode=disable"
      GRPC_ADDR: ":9090"
    ports:
      - "9090:9090"
    volumes:
      # T1: sole writer of uploaded photos; proxy-service mounts the same
      # volume read-only to serve them over HTTP.
      - photo-data:/data/photos
    depends_on:
      activities-db:
        condition: service_healthy

  proxy-service:
    build:
      context: ./backend
      dockerfile: proxy-service/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      ACTIVITIES_SERVICE_ADDR: "activities-service:9090"
      # Admin surface (T2): gates /admin/*. Empty by default so the stack
      # comes up with those routes disabled (fail closed) rather than
      # requiring every dev to set a token just to run `docker compose up`;
      # set this in the shell env to enable the admin panel.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      # T1: read-only — activities-service is the sole writer, proxy-service
      # only serves GET /photos/... off the same files.
      - photo-data:/data/photos:ro
    depends_on:
      - activities-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PROXY_URL: ${VITE_PROXY_URL:-http://localhost:8080}
        # Admin panel (T3): must match proxy-service's ADMIN_API_TOKEN above.
        # Empty by default, same fail-closed-by-default posture — the admin
        # screens build and serve either way, they just show the "admin
        # access rejected" state until both are set.
        VITE_ADMIN_TOKEN: ${ADMIN_API_TOKEN:-}
        # T4: Google Static Maps API key for the Edit activity screen's
        # read-only location preview. Optional — unset means the map image
        # request 404s and the preview falls back to its broken-image
        # state (see frontend/.env.example), so the stack still comes up
        # fine without it.
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "4173:4173"
    depends_on:
      - proxy-service

  app:
    build:
      context: ./app
      args:
        EXPO_PUBLIC_PROXY_URL: http://localhost:8080
        # T4/T7's Google Maps Platform key (Places + Maps Static APIs) — read
        # from the shell env, empty by default so the build never requires a
        # live billed key; the app degrades to its no-key fallback instead.
        EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "4174:4174"
    depends_on:
      - proxy-service

volumes:
  postgres-data:
  activities-db-data:
  photo-data:
