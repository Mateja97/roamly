services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy-service:
    build:
      context: ./backend
      dockerfile: proxy-service/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PROXY_URL: http://localhost:8080
    ports:
      - "4173:4173"
    depends_on:
      - proxy-service

  app:
    build:
      context: ./app
      args:
        EXPO_PUBLIC_PROXY_URL: http://localhost:8080
    ports:
      - "4174:4174"
    depends_on:
      - proxy-service

volumes:
  postgres-data:
